<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Tournament Hub</title>
<meta name="theme-color" content="#0A0F1F">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* Colour roles (so the page stops feeling noisy):
   volt (cyan)  = brand + the ONE primary action on a screen
   neon (green) = success / confirmed / join
   gold         = money and prizes only
   red          = danger / dispute only                                   */
tailwind.config={theme:{extend:{
  colors:{ink:'#0A0F1F',panel:'#131A2E',volt:'#22D3EE',neon:'#34D399',gold:'#FBBF24',
    slate:{200:'#E2E8F4',300:'#D0D8E8',400:'#AAB6CC',500:'#8592AA'}},
  fontFamily:{sans:['Hind Siliguri','Noto Sans Bengali','Nirmala UI','system-ui','sans-serif']},
  fontSize:{xs:['0.8125rem','1.3rem'],sm:['0.9375rem','1.5rem'],base:['1.0625rem','1.7rem']}
}}}
</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@layer components{
 .glass{@apply bg-panel/95 border border-white/10 shadow-lg shadow-black/20}
 .inp{@apply w-full rounded-xl bg-ink border border-white/20 px-3.5 py-3 text-base text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-volt focus:ring-2 focus:ring-volt/30}
 .btn{@apply inline-flex min-h-[48px] items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-base font-semibold transition active:scale-[.97] disabled:opacity-40 disabled:pointer-events-none}
 .btn-p{@apply bg-volt text-ink hover:brightness-110 shadow-lg shadow-volt/20}
 .btn-g{@apply bg-white/10 text-slate-100 hover:bg-white/15}
 .btn-n{@apply bg-neon text-ink hover:brightness-110}
 .btn-d{@apply bg-red-500 text-white hover:bg-red-400}
 .badge{@apply inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-bold}
 .lbl{@apply mb-1.5 block text-sm font-medium text-slate-200}
}
html{font-size:17px;color-scheme:dark}
html,body{background:#0A0F1F}
body{line-height:1.7;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(55rem 26rem at 50% -8%,rgba(34,211,238,.13),transparent),radial-gradient(34rem 18rem at 100% 0%,rgba(52,211,153,.06),transparent);background-attachment:fixed}
/* arbitrary tiny sizes used in app.js: lift them to a readable minimum */
.text-\[11px\],.text-\[10px\]{font-size:.8rem!important;line-height:1.25rem!important}
.uppercase{text-transform:none!important;letter-spacing:0!important} /* Bangla has no capitals */
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';float:right;color:#22D3EE;font-weight:700}details[open]>summary::after{content:'–'}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #22D3EE;outline-offset:2px;border-radius:.5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="min-h-screen font-sans text-slate-100 antialiased">
<header class="sticky top-0 z-40 border-b border-white/10 bg-ink/90 backdrop-blur-md" style="padding-top:env(safe-area-inset-top)">
  <div class="mx-auto flex h-14 max-w-3xl items-center justify-between px-4">
    <a href="#/" class="flex items-center gap-2 text-lg font-bold tracking-tight"><span class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-volt to-neon text-ink"><i data-lucide="trophy" class="h-4 w-4"></i></span>DLS <span class="text-volt">Tournament Hub</span></a>
    <div id="hdr"></div>
  </div>
</header>
<main id="app" class="mx-auto max-w-3xl pb-28"></main>
<nav id="nav" class="fixed inset-x-0 bottom-0 z-40 border-t border-white/10 bg-ink/95 backdrop-blur-md" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
