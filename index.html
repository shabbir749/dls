<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Tournament Hub</title>
<meta name="theme-color" content="#0F172A">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0F172A',panel:'#1E293B',volt:'#06B6D4',neon:'#22C55E',gold:'#F59E0B'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@layer components{
 .glass{@apply bg-slate-800/50 backdrop-blur-md border border-white/10}
 .inp{@apply w-full rounded-xl bg-slate-900/70 border border-white/10 px-3 py-2.5 text-sm outline-none transition focus:border-volt focus:ring-2 focus:ring-volt/30}
 .btn{@apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none}
 .btn-p{@apply bg-volt text-ink hover:bg-cyan-300 shadow-lg shadow-volt/20}
 .btn-g{@apply bg-white/10 hover:bg-white/15}
 .btn-n{@apply bg-neon text-ink hover:bg-green-400}
 .btn-d{@apply bg-red-500/80 hover:bg-red-500}
 .badge{@apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide}
 .lbl{@apply mb-1 block text-xs font-medium text-slate-400}
}
html,body{background:#0F172A}
body{background-image:radial-gradient(60rem 30rem at 50% -10%,rgba(6,182,212,.15),transparent),radial-gradient(40rem 20rem at 100% 10%,rgba(34,197,94,.08),transparent);background-attachment:fixed}
</style>
</head>
<body class="min-h-screen font-sans text-slate-100 antialiased">
<header class="sticky top-0 z-40 border-b border-white/10 bg-ink/70 backdrop-blur-md" style="padding-top:env(safe-area-inset-top)">
  <div class="mx-auto flex h-14 max-w-3xl items-center justify-between px-4">
    <a href="#/" class="flex items-center gap-2 font-extrabold tracking-tight"><span class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-volt to-neon text-ink"><i data-lucide="trophy" class="h-4 w-4"></i></span>DLS <span class="text-volt">Arena</span></a>
    <div id="hdr"></div>
  </div>
</header>
<main id="app" class="mx-auto max-w-3xl pb-28"></main>
<nav class="fixed inset-x-0 bottom-0 z-40 border-t border-white/10 bg-ink/80 backdrop-blur-md" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="mx-auto grid max-w-3xl grid-cols-3">
    <a href="#/" data-nav="" class="flex flex-col items-center gap-0.5 py-2 text-[11px] text-slate-400 transition"><i data-lucide="swords" class="h-5 w-5"></i>Feed</a>
    <a href="#/new" data-nav="new" class="flex flex-col items-center gap-0.5 py-2 text-[11px] text-slate-400 transition"><i data-lucide="plus-circle" class="h-5 w-5"></i>Host</a>
    <a href="#/me" data-nav="me" class="flex flex-col items-center gap-0.5 py-2 text-[11px] text-slate-400 transition"><i data-lucide="user-round" class="h-5 w-5"></i>Profile</a>
  </div>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
